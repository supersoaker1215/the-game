<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Neon "Card Lane Battle" app icon — Tron-style capsule with
       a stylized card silhouette + energy diamond. Matches the
       in-game theme aesthetic. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a1620"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Black disc with subtle radial wash -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Outer neon frame -->
  <rect x="20" y="20" width="472" height="472" rx="80" ry="80"
        fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.55"/>
  <!-- Inner highlight -->
  <rect x="34" y="34" width="444" height="444" rx="68" ry="68"
        fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.25"/>
  <!-- Card silhouette (centered) -->
  <g filter="url(#glow)">
    <rect x="156" y="104" width="200" height="280" rx="14" ry="14"
          fill="url(#cardGrad)" stroke="#4fc3f7" stroke-width="4"/>
    <!-- Diamond cost pip top-left -->
    <g transform="translate(170 118) rotate(45)">
      <rect x="-22" y="-22" width="44" height="44" fill="#000"
            stroke="#4fc3f7" stroke-width="3"/>
    </g>
    <!-- ATK chip -->
    <circle cx="186" cy="354" r="18" fill="#000" stroke="#2ecc71" stroke-width="3"/>
    <!-- HP chip -->
    <circle cx="326" cy="354" r="18" fill="#000" stroke="#e74c3c" stroke-width="3"/>
    <!-- Middle slash -->
    <line x1="220" y1="360" x2="292" y2="348" stroke="#6a7580" stroke-width="3"/>
  </g>
  <!-- Corner HUD brackets -->
  <g stroke="#4fc3f7" stroke-width="4" fill="none" opacity="0.9">
    <path d="M 56 100 L 56 56 L 100 56"/>
    <path d="M 412 56 L 456 56 L 456 100"/>
    <path d="M 456 412 L 456 456 L 412 456"/>
    <path d="M 100 456 L 56 456 L 56 412"/>
  </g>
</svg>
