<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>body{background:#000;color:#0ff;font-family:monospace;padding:20px}
span{font-size:100px}</style></head><body>
<div id="out">measuring…</div>
<script>
function w(txt, fam, feat){
  const s=document.createElement('span');
  s.style.fontFamily=fam; s.style.fontSize='100px'; s.style.fontWeight='700';
  s.style.position='absolute'; s.style.whiteSpace='pre';
  if(feat==='tnum'){ s.style.fontVariantNumeric='tabular-nums'; s.style.fontFeatureSettings='"tnum" 1'; }
  s.textContent=txt; document.body.appendChild(s);
  const r=s.getBoundingClientRect().width; s.remove(); return r;
}
document.fonts.ready.then(()=>{
  const lines=[];
  for(const fam of ["Rajdhani","Inter","JetBrains Mono"]){
    lines.push("### "+fam+"  loaded="+document.fonts.check("700 100px '"+fam+"'"));
    const digits="0123456789".split('');
    for(const feat of ['default','tnum']){
      const ws=digits.map(d=>+w(d,"'"+fam+"'",feat).toFixed(2));
      const min=Math.min(...ws), max=Math.max(...ws);
      lines.push("  "+feat.padEnd(8)+" widths="+ws.join(',')+"  spread="+(max-min).toFixed(2)+"px  uniform="+(max-min<0.01));
    }
    // real-world: does "11" and "30" match width
    lines.push("  '11' vs '30' default: "+w('11',"'"+fam+"'",'default').toFixed(2)+" vs "+w('30',"'"+fam+"'",'default').toFixed(2));
    lines.push("  '11' vs '30' tnum   : "+w('11',"'"+fam+"'",'tnum').toFixed(2)+" vs "+w('30',"'"+fam+"'",'tnum').toFixed(2));
  }
  document.getElementById('out').textContent=lines.join('\n');
  document.getElementById('out').style.whiteSpace='pre';
});
</script></body></html>
