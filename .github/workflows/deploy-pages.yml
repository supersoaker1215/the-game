name: Deploy to GitHub Pages

# Publishes the static site (this whole repo — plain vanilla JS/HTML/CSS, no
# build step) to GitHub Pages on every push to main. The repo's Pages source
# must be set to "GitHub Actions" (Settings → Pages → Build and deployment →
# Source: GitHub Actions) for this to take effect. Before this workflow existed
# the only workflow (ci.yml) just ran tests, so nothing was ever published and
# the live site was frozen at an old build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the repo root as-is. .git is excluded automatically; the
          # extra dev files (sim/, *.md, .github/) are harmless static assets.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
