name: CI

# THE RELEASE GATE. Every push (any branch) and every pull request runs the
# same two commands the pre-commit hook runs locally. A push to main deploys
# to GitHub Pages ONLY if they pass, so the live site is always the last green
# commit on main and a red commit never reaches players.
#
# macOS, not Ubuntu: the suites call JavaScriptCore at its macOS path
# (/System/Library/Frameworks/JavaScriptCore.framework/...), so the runner
# is the same jsc the maintainers run. Ubuntu's jsc package was renamed in
# 26.04 and broke the old install step on every run.
#
# Pages source must be "GitHub Actions" (Settings → Pages), or the legacy
# branch build deploys every push to main ungated alongside this.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: tests + lint + fuzz
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # run-tests.sh SKIPS lint (and still passes) when deno is missing, so
      # deno must be installed here for the lint gate to mean anything.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Golden / regression suites + deno lint
        run: ./sim/run-tests.sh

      - name: Fuzz (500 1v1 + 60 2v2 seeded games)
        run: ./sim/run-fuzz.sh

  deploy:
    name: deploy to GitHub Pages
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a queued deploy is replaced by a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Two quick pushes run their gates in parallel; if the OLDER one finishes
      # last it must not overwrite the newer build. Deploy only main's tip.
      - name: Skip if main has moved on
        id: tip
        run: |
          TIP=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "main is at $TIP, this run is ${{ github.sha }} — leaving the deploy to the newer run"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tip.outputs.stale != 'true'

      - uses: actions/configure-pages@v5
        if: steps.tip.outputs.stale != 'true'

      # The repo root is the site (vanilla JS, no build step). .git is excluded
      # automatically; sim/ and docs ship as harmless static files.
      - uses: actions/upload-pages-artifact@v3
        if: steps.tip.outputs.stale != 'true'
        with:
          path: '.'

      - name: Deploy
        id: deployment
        if: steps.tip.outputs.stale != 'true'
        uses: actions/deploy-pages@v4
